<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="8" fill="#FAF8F5"/>
  <!-- Lock -->
  <rect x="165" y="130" width="70" height="60" rx="6" fill="#002C5A"/>
  <path d="M180 130 L180 105 C180 85 220 85 220 105 L220 130" fill="none" stroke="#002C5A" stroke-width="4"/>
  <!-- Keyhole -->
  <circle cx="200" cy="155" r="8" fill="#FAF8F5"/>
  <rect x="197" y="160" width="6" height="15" rx="3" fill="#FAF8F5"/>
  <!-- Red cross / ban -->
  <circle cx="200" cy="145" r="65" fill="none" stroke="#FF8686" stroke-width="3" opacity="0.5"/>
  <line x1="155" y1="100" x2="245" y2="190" stroke="#FF8686" stroke-width="3" opacity="0.5"/>
  <!-- "AI" text flying away -->
  <text x="280" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#002C5A" opacity="0.2">AI</text>
  <text x="100" y="240" font-family="sans-serif" font-size="14" fill="#002C5A" opacity="0.2">ChatGPT</text>
</svg>
